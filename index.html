
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhumika Tewari | Software Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #000000;
        --text-color: #ffffff;
        --grid-color: rgba(255, 255, 255, 0.05);
        --accent-1: rgba(192, 38, 211, 0.15);
        --accent-2: rgba(59, 130, 246, 0.15);
        --accent-3: rgba(236, 72, 153, 0.15);
      }

      html.light {
        --bg-color: #f8f9fa;
        --text-color: #0f172a;
        --grid-color: rgba(0, 0, 0, 0.05);
        --accent-1: rgba(192, 38, 211, 0.08);
        --accent-2: rgba(59, 130, 246, 0.08);
        --accent-3: rgba(236, 72, 153, 0.08);
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow-x: hidden;
        transition: background-color 0.5s ease, color 0.5s ease;
      }

      .font-playfair {
        font-family: 'Playfair Display', serif;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }

      .app-background {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        overflow: hidden;
        background-color: var(--bg-color);
      }

      .mesh-layer {
        position: absolute;
        inset: -50%;
        width: 200%;
        height: 200%;
        background: 
          radial-gradient(circle at 20% 30%, var(--accent-1) 0%, transparent 40%),
          radial-gradient(circle at 80% 20%, var(--accent-2) 0%, transparent 40%),
          radial-gradient(circle at 50% 80%, var(--accent-3) 0%, transparent 40%),
          radial-gradient(circle at 80% 80%, var(--accent-1) 0%, transparent 40%);
        animation: mesh-rotate 60s linear infinite;
        filter: blur(100px);
      }

      .grid-layer {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
                          linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(circle at 50% 50%, black 10%, transparent 90%);
        animation: grid-drift 30s linear infinite;
      }

      .noise-layer {
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.03;
        mix-blend-mode: overlay;
      }

      .beams-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      
      .beam {
        position: absolute;
        width: 1px;
        height: 100%;
        background: linear-gradient(to bottom, transparent, rgba(192, 38, 211, 0.2), transparent);
        animation: beam-move 10s ease-in-out infinite;
      }

      @keyframes beam-move {
        0%, 100% { transform: translateX(-100%) skewX(-45deg); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateX(200%) skewX(-45deg); opacity: 0; }
      }

      @keyframes mesh-rotate {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.2); }
        100% { transform: rotate(360deg) scale(1); }
      }

      @keyframes grid-drift {
        0% { background-position: 0 0; }
        100% { background-position: 60px 60px; }
      }

      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-marquee {
        display: flex;
        width: 200%;
        animation: marquee 30s linear infinite;
      }

      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }

      @keyframes rotate-globe {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .animate-globe {
        animation: rotate-globe 40s linear infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.2.0"
  }
}
</script>
</head>
  <body>
    <div class="app-background">
      <div class="mesh-layer"></div>
      <div class="grid-layer"></div>
      <div class="noise-layer"></div>
      <div class="beams-layer">
        <div class="beam" style="left: 20%; animation-duration: 15s"></div>
        <div class="beam" style="left: 50%; animation-duration: 20s; animation-delay: 2s"></div>
        <div class="beam" style="left: 80%; animation-duration: 12s; animation-delay: 5s"></div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
