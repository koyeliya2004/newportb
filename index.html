<!DOCTYPE html>
<html lang="en" class="dark" style="scroll-behavior: smooth;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhumika Tewari | Software Engineer</title>
    <link rel="icon" type="image/svg+xml" href="/assets/app-logo.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #000000;
        --text-color: #ffffff;
        --grid-color: rgba(255, 255, 255, 0.03);
        --accent-1: rgba(192, 38, 211, 0.12);
        --accent-2: rgba(59, 130, 246, 0.1);
        --accent-3: rgba(236, 72, 153, 0.1);
        --blob-color: rgba(192, 38, 211, 0.05);
      }

      html.light {
        --bg-color: #fcfcfc;
        --text-color: #0f172a;
        --grid-color: rgba(0, 0, 0, 0.02);
        --accent-1: rgba(192, 38, 211, 0.05);
        --accent-2: rgba(59, 130, 246, 0.05);
        --accent-3: rgba(236, 72, 153, 0.05);
        --blob-color: rgba(0, 0, 0, 0.02);
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow-x: hidden;
        transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s ease;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .font-playfair {
        font-family: 'Playfair Display', serif;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 10px;
      }

      .app-background {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        overflow: hidden;
        background-color: var(--bg-color);
        transform: translate3d(0,0,0);
        perspective: 1000px;
      }

      .mesh-layer {
        position: absolute;
        inset: -100%;
        width: 300%;
        height: 300%;
        background: 
          radial-gradient(circle at 30% 20%, var(--accent-1) 0%, transparent 35%),
          radial-gradient(circle at 70% 80%, var(--accent-2) 0%, transparent 35%),
          radial-gradient(circle at 10% 90%, var(--accent-3) 0%, transparent 35%),
          radial-gradient(circle at 90% 10%, var(--accent-1) 0%, transparent 35%);
        animation: mesh-drift 80s ease-in-out infinite alternate;
        filter: blur(120px);
        will-change: transform;
        transform: translate3d(0,0,0);
      }

      @keyframes mesh-drift {
        0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
        50% { transform: translate3d(-2%, -2%, 0) scale(1.05) rotate(2deg); }
        100% { transform: translate3d(2%, 2%, 0) scale(1) rotate(-2deg); }
      }

      .blobs-container {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      .bg-blob {
        position: absolute;
        border-radius: 50%;
        background: var(--blob-color);
        filter: blur(80px);
        animation: blob-float var(--duration) ease-in-out infinite alternate;
        will-change: transform;
        transform: translate3d(0,0,0);
      }
      @keyframes blob-float {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(var(--x), var(--y), 0) scale(1.1); }
      }

      .grid-layer {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
                          linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 80px 80px;
        mask-image: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), black 0%, transparent 80%);
        transition: mask-image 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 0.6;
        will-change: mask-image;
      }

      .noise-layer {
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.05;
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      .stardust-layer {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0);
        background-size: 100px 100px;
        animation: stardust-drift 100s linear infinite;
        will-change: background-position;
      }
      @keyframes stardust-drift {
        from { background-position: 0 0; }
        to { background-position: 1000px 1000px; }
      }

      .beams-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .beam {
        position: absolute;
        width: 1.5px;
        height: 100%;
        background: linear-gradient(to bottom, transparent, rgba(192, 38, 211, 0.1), transparent);
        animation: beam-sweep 15s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes beam-sweep {
        0% { transform: translate3d(-100vw, 0, 0) skewX(-45deg); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translate3d(100vw, 0, 0) skewX(-45deg); opacity: 0; }
      }

      .reveal {
        opacity: 0;
        transform: translate3d(0, 20px, 0);
        transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      .reveal.active {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0"
  }
}
</script>
</head>
  <body>
    <div class="app-background">
      <div class="mesh-layer"></div>
      <div class="stardust-layer"></div>
      <div class="blobs-container">
        <div class="bg-blob" style="--duration: 25s; --x: 100px; --y: 50px; width: 400px; height: 400px; left: 10%; top: 20%;"></div>
        <div class="bg-blob" style="--duration: 35s; --x: -80px; --y: 120px; width: 500px; height: 500px; right: 15%; bottom: 10%; background: rgba(59, 130, 246, 0.05);"></div>
      </div>
      <div class="grid-layer"></div>
      <div class="noise-layer"></div>
      <div class="beams-layer">
        <div class="beam" style="left: 10%; animation-delay: 0s;"></div>
        <div class="beam" style="left: 40%; animation-delay: 5s; background: linear-gradient(to bottom, transparent, rgba(59, 130, 246, 0.1), transparent);"></div>
        <div class="beam" style="left: 70%; animation-delay: 10s;"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      let ticking = false;
      document.addEventListener('mousemove', (e) => {
        if (!ticking) {
          window.requestAnimationFrame(() => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            document.documentElement.style.setProperty('--mouse-x', x + '%');
            document.documentElement.style.setProperty('--mouse-y', y + '%');
            ticking = false;
          });
          ticking = true;
        }
      });
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
